name: build

on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

    secrets:
      JOIN_DEPLOY_KNOWN_HOST:
        required: false
      JOIN_DEPLOY_KEY:
        required: false
      JOIN_DEPLOY_DEST:
        required: false
      JOIN_DEPLOY_PORT:
        required: false

  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: joinframework/join-ci:latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Build
        run: hugo --minify

      - name: Upload to GitHub
        uses: actions/upload-artifact@v7.0.0
        with:
          name: join-www
          path: public/

      - name: Deploy
        if: inputs.deploy
        env:
          KNOWN_HOST: ${{ secrets.JOIN_DEPLOY_KNOWN_HOST }}
          DEPLOY_KEY: ${{ secrets.JOIN_DEPLOY_KEY }}
          DEST: ${{ secrets.JOIN_DEPLOY_DEST }}
          PORT: ${{ secrets.JOIN_DEPLOY_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k > /dev/null 2>&1' EXIT
          printf '%s\n' "$DEPLOY_KEY" | ssh-add -
          rsync -avz --delete ${{ inputs.dry_run && '--dry-run' || '' }} \
            -e "ssh -p $PORT -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            public/ "$DEST"
